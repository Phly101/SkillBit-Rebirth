name: flutter PR checks

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutterPr.yaml'
    branches: [ main ]

concurrency:
  group: flutter-pr-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up flutter
        uses: subosito/flutter-action@v2
        with:
          #check if environment key is in the pubspec.yaml so that this doesn't fail
          channel: stable
          flutter-version-file: mobile/pubspec.yaml
          cache: true
      - run: flutter --version
      - name: Get packages
        run: flutter pub get

      - name: Format code
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      - name: Flutter test
        run: flutter test

