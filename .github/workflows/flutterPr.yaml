name: flutter PR checks

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: flutter-pr-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile


jobs:
  changes: # new small job: "did mobile change?"
    name: flutter-changes
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            mobile:
              - 'mobile/**'
              - '.github/workflows/flutterPr.yaml'




  flutter-check:
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - name: Set up flutter
        uses: subosito/flutter-action@v2
        with:
          # check if environment key is in the pubspec.yaml so that this doesn't fail
          channel: stable
          flutter-version-file: mobile/pubspec.yaml
          cache: true
      - run: flutter --version
      - name: Get packages
        run: flutter pub get

      - name: Format code
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      - name: Flutter test
        run: flutter test

