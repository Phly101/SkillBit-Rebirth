# ===================================================================
# 1. SQL Query Tracing & Performance Metrics
# ===================================================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=500


# ===================================================================
# 2. Microsecond Request & Trace Context (MDC Logging)
# ===================================================================
logging.pattern.console=${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.flywaydb=INFO


# ===================================================================
# 3. Actuator Diagnostics & Health Probes
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics,env,loggers,threaddump,flyway
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.metrics.tags.application=${spring.application.name}


# ===================================================================
# 4. Database Connection Pool (HikariCP) Leak Tracing
# ===================================================================
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=5000
spring.datasource.hikari.max-lifetime=1800000


# ===================================================================
# 5. Detailed Exception & Error Payload Reporting
# ===================================================================
server.error.include-exception=true
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always


# ===================================================================
# 6. GraphQL-Specific Execution Diagnostics
# ===================================================================
spring.graphql.graphiql.enabled=true
spring.graphql.servlet.mapping=/graphql
spring.graphql.show-pagination-count=true